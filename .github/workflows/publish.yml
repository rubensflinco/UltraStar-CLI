name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-main
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  BUN_VERSION: "1.2.19"

jobs:
  publish:
    runs-on: ubuntu-latest
    if: "${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore: release') }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun.js
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun i

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version, commit and tag
        id: bump
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            bunx bumpp patch --yes --commit "chore: release v%s" --tag "v%s" --push
            VERSION="$(node -p "require('./package.json').version")"
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
            echo "Tagged current version v${VERSION}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing v$VERSION"

      - name: Build CLI
        run: bun run build

      - name: Publish to npm
        run: |
          cd build
          bun publish --verbose --access public --tag latest
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Generate GitHub Release
        run: bunx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          {
            echo "# UltraStar CLI Plus - release"
            echo ""
            echo "- **Version**: \`v${VERSION}\`"
            echo "- **npm**: https://www.npmjs.com/package/ultrastar-cli-plus"
            echo "- **Install**: \`npx ultrastar-cli-plus\`"
            echo "- **Release**: https://github.com/${{ github.repository }}/releases/tag/v${VERSION}"
          } >> "$GITHUB_STEP_SUMMARY"
